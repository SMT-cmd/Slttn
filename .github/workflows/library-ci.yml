name: Library PDF and Reader Checks

on:
  push:
    branches:
      - feature/pdf-import-flip-reader-20261021
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node --experimental-strip-types --test scripts/admin-pdf.test.mjs scripts/admin-pdf-import.test.mjs
      - run: node --experimental-transform-types --test src/lib/supabase.test.ts
      - run: node --experimental-strip-types --test src/lib/reader/page-turn.test.ts
