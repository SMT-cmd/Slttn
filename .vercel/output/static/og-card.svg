      <tspan x="0" dy="36">for Volatility, Boom &amp; Crash, Step, Jump, and Range markets.</tspan>
    </text>

    <g transform="translate(0 420)" fill="#F7FAFC" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">
      <g>
        <rect width="110" height="42" rx="21" fill="#F7FAFC" opacity="0.10" stroke="#F7FAFC" stroke-opacity="0.14" />
        <text x="55" y="27" text-anchor="middle">Volatility</text>
      </g>
      <g transform="translate(126 0)">
        <rect width="160" height="42" rx="21" fill="#F7FAFC" opacity="0.10" stroke="#F7FAFC" stroke-opacity="0.14" />
        <text x="80" y="27" text-anchor="middle">Boom &amp; Crash</text>
      </g>
      <g transform="translate(302 0)">
        <rect width="86" height="42" rx="21" fill="#F7FAFC" opacity="0.10" stroke="#F7FAFC" stroke-opacity="0.14" />
        <text x="43" y="27" text-anchor="middle">Step</text>
      </g>
      <g transform="translate(404 0)">
        <rect width="86" height="42" rx="21" fill="#F7FAFC" opacity="0.10" stroke="#F7FAFC" stroke-opacity="0.14" />
        <text x="43" y="27" text-anchor="middle">Jump</text>
      </g>
      <g transform="translate(506 0)">
        <rect width="94" height="42" rx="21" fill="#F7FAFC" opacity="0.10" stroke="#F7FAFC" stroke-opacity="0.14" />
        <text x="47" y="27" text-anchor="middle">Range</text>
      </g>
    </g>
