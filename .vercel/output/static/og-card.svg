  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="90" cy="85" r="330" fill="url(#glowBlue)" />
  <circle cx="180" cy="645" r="320" fill="url(#glowGreen)" />
  <circle cx="1080" cy="70" r="240" fill="#4FB5FF" opacity="0.10" />

  <g transform="translate(72 64)">
    <g>
      <circle cx="42" cy="42" r="42" fill="#1E6BFF" />
      <path d="M18 18h50v15H18zM53 18h15v50H53zM18 44h15v15H18zM18 54h30v10H18zM33 59h15v15H33zM18 84h30v10H18z" fill="#FAFBFC" />
    </g>
    <text x="106" y="24" fill="#C9D6E8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="4">SLT TRADE HUB</text>
    <text x="106" y="58" fill="#F7FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Synthetic indices trading books and education</text>

    <text x="0" y="160" fill="#F7FAFC" font-family="Georgia, serif" font-size="68" font-weight="700">
      <tspan x="0" dy="0">Serious trading books</tspan>
      <tspan x="0" dy="74">for synthetic indices traders.</tspan>
    </text>

    <text x="0" y="315" fill="#D6E1EF" font-family="Arial, Helvetica, sans-serif" font-size="25">
