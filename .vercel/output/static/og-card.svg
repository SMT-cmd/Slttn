<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SLT Trade Hub Open Graph Card</title>
  <desc id="desc">Share card for synthetic indices trading books and education.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081423" />
      <stop offset="58%" stop-color="#0E2744" />
      <stop offset="100%" stop-color="#163B63" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="0%" cy="0%" r="95%">
      <stop offset="0%" stop-color="#1E6BFF" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#1E6BFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#1E6BFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowGreen" cx="0%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#12C48B" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#12C48B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#12C48B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9FBFF" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#F9FBFF" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="bookBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FAFC" />
      <stop offset="100%" stop-color="#DAE6F6" />
    </linearGradient>
    <linearGradient id="bookNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173B69" />
      <stop offset="100%" stop-color="#0C2036" />
    </linearGradient>
    <linearGradient id="bookGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12C48B" />
      <stop offset="100%" stop-color="#0E9D70" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#04101B" flood-opacity="0.36" />
