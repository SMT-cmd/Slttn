    <rect width="308" height="506" rx="34" fill="url(#panel)" stroke="#F7FAFC" stroke-opacity="0.14" />
    <text x="30" y="38" fill="#C9D6E8" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3">THE TRADING LIBRARY</text>
    <text x="30" y="88" fill="#F7FAFC" font-family="Georgia, serif" font-size="40" font-weight="700">
      <tspan x="30" dy="0">Clear material</tspan>
      <tspan x="30" dy="42">for real trading work</tspan>
    </text>

    <g transform="translate(30 154)">
      <rect width="130" height="184" rx="14" fill="url(#bookBlue)" />
      <rect x="130" y="0" width="8" height="184" fill="#AFC1D7" />
      <text x="22" y="36" fill="#173B69" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">SYNTHETIC INDICES</text>
      <text x="22" y="82" fill="#0E2744" font-family="Georgia, serif" font-size="28" font-weight="700">
        <tspan x="22" dy="0">101</tspan>
      </text>
      <rect x="22" y="108" width="86" height="6" rx="3" fill="#C4D3E6" />
      <rect x="22" y="124" width="72" height="6" rx="3" fill="#C4D3E6" />
      <rect x="22" y="140" width="90" height="6" rx="3" fill="#C4D3E6" />
    </g>

    <g transform="translate(168 190) rotate(9)">
      <rect width="92" height="150" rx="12" fill="url(#bookNavy)" />
      <rect x="92" y="0" width="6" height="150" fill="#274E7C" />
      <rect x="18" y="26" width="56" height="5" rx="2.5" fill="#F7FAFC" opacity="0.88" />
      <rect x="18" y="40" width="44" height="5" rx="2.5" fill="#F7FAFC" opacity="0.66" />
      <rect x="18" y="100" width="58" height="28" rx="8" fill="#1E6BFF" opacity="0.88" />
    </g>

    <g transform="translate(112 312) rotate(-8)">
      <rect width="116" height="162" rx="12" fill="url(#bookGreen)" />
      <rect x="116" y="0" width="7" height="162" fill="#0A855D" />
      <rect x="20" y="28" width="56" height="5" rx="2.5" fill="#ECFFFA" opacity="0.90" />
      <rect x="20" y="42" width="42" height="5" rx="2.5" fill="#ECFFFA" opacity="0.68" />
      <rect x="20" y="114" width="70" height="10" rx="5" fill="#ECFFFA" opacity="0.34" />
      <rect x="20" y="132" width="52" height="10" rx="5" fill="#ECFFFA" opacity="0.34" />
    </g>

    <g transform="translate(30 420)">
      <rect width="196" height="54" rx="18" fill="#081423" opacity="0.46" stroke="#F7FAFC" stroke-opacity="0.10" />
      <text x="18" y="25" fill="#F7FAFC" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Secure reader</text>
      <text x="18" y="42" fill="#D6E1EF" font-family="Arial, Helvetica, sans-serif" font-size="13">Member pricing and titles built for repeat study.</text>
